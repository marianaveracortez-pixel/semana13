name: Validar y simular deploy

on:
  push:
    branches: ["main"]
permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-lastest
    steps:
      - name: "Preparar repositorio"
        uses: actions/checkout@v4

      - name: "PASO 1 Estructura de carpetas"
        run: |
          test -d app
          test -f app/index.php
          test -f Dockerfile
          test -f docker-compose.yml
      
      - name: "construccion"
        run:  docker compose build
